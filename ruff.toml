# Lint settings for the Python outside monitor/ (monitor/pyproject.toml has its own, stricter line length).
line-length = 120
target-version = "py310"
# The Colab notebook is generated by experiments/colab/build_notebook.py (CI checks that it is in sync);
# its cells are written for interactive use, so it is not linted.
extend-exclude = ["*.ipynb"]

[lint]
# Pinned explicitly so a new ruff release cannot change what CI checks (ruff's classic default set).
select = ["E4", "E7", "E9", "F"]
